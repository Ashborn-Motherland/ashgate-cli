name: Release Ashgate CLI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build & Release Ultra-Fast Bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install

      - name: Build Ultra-Fast Bundle (ncc)
        run: pnpm build

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-binaries
          cp bundle/index.js release-binaries/ashgate.js
          cp scripts/install.sh release-binaries/install.sh
          ls -lh release-binaries/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-binaries/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
